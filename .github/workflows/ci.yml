name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        # Chocolatey installs ffmpeg as a shim under
        # C:\ProgramData\Chocolatey\bin that launches the real binary
        # via a hardcoded path; copying the shim into assets/bin/ then
        # leaves it unable to find its target, so integration tests
        # that exec the staged ffmpeg fail with exit code -1. Download
        # a portable build directly so `where ffmpeg` resolves to the
        # actual ffmpeg.exe.
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          $binDir = (Get-ChildItem ffmpeg-extracted -Directory)[0].FullName + "\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
          & "$binDir\ffmpeg.exe" -version

      - name: Ensure ffmpeg present (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version

      - name: Stage system ffmpeg into assets/bin
        run: dart run tool/stage_system_ffmpeg.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test (with coverage)
        run: flutter test --coverage

      - name: Coverage summary
        run: dart run tool/coverage_summary.dart

      # Release builds on tag pushes (vX.Y…); debug builds otherwise.
      # Release artifacts are zipped and uploaded as workflow artifacts;
      # see the package + upload steps below.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        # Disable code signing — we don't have a Developer ID on CI; the
        # produced .app is unsigned and Gatekeeper will warn end users
        # the first time they open it. Right-click → Open dismisses the
        # warning. Add a Developer ID + signing setup later for a
        # one-click experience.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            flutter build macos --release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            flutter build macos --debug
          fi

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ninja-build libgtk-3-dev
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            flutter build linux --release
          else
            flutter build linux --debug
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            flutter build windows --release
          } else {
            flutter build windows --debug
          }

      # ---- Tag-triggered release artifacts ----
      #
      # When a tag matching v* is pushed, zip the per-platform release
      # output and upload it as a GitHub Actions workflow artifact.
      # Artifacts are named with the tag (e.g. m4b-chapterizer-v1.0-macos.zip)
      # and retained per the repo's default artifact retention (90 days).
      # For long-term distribution, attach these to a GitHub Release in
      # a follow-up.

      - name: Package macOS app (tag only)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent m4b_chapterizer.app \
            "$GITHUB_WORKSPACE/m4b-chapterizer-${GITHUB_REF_NAME}-macos.zip"

      - name: Package Linux app (tag only)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        run: |
          cd build/linux/x64/release
          zip -r "$GITHUB_WORKSPACE/m4b-chapterizer-${GITHUB_REF_NAME}-linux.zip" bundle

      - name: Package Windows app (tag only)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $dest = "$env:GITHUB_WORKSPACE\m4b-chapterizer-$env:GITHUB_REF_NAME-windows.zip"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $dest

      - name: Upload release artifact (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: m4b-chapterizer-${{ github.ref_name }}-${{ runner.os == 'macOS' && 'macos' || (runner.os == 'Linux' && 'linux' || 'windows') }}
          path: m4b-chapterizer-${{ github.ref_name }}-*.zip
          if-no-files-found: error
