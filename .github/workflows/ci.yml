name: CI

on:
  push:
  pull_request:

# Required by softprops/action-gh-release to create / update a GitHub
# Release on tag pushes. No effect on push or pull_request runs that
# don't fire the release steps.
permissions:
  contents: write

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Decide once whether this run is a "release run". A release run
      # is a tag push whose tag name is a strict SemVer 2.0 string
      # (X.Y.Z, X.Y.Z-pre.1, X.Y.Z+meta, etc.). Anything else — branch
      # pushes, PRs, non-SemVer tags — produces a debug build with no
      # artifact upload.
      - name: Detect release tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Canonical SemVer 2.0 regex from https://semver.org/.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ "${GITHUB_REF}" == refs/tags/* ]] && [[ "$tag" =~ $semver ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Release run for tag $tag"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release run (ref=$GITHUB_REF)"
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        # Chocolatey installs ffmpeg as a shim under
        # C:\ProgramData\Chocolatey\bin that launches the real binary
        # via a hardcoded path; copying the shim into assets/bin/ then
        # leaves it unable to find its target, so integration tests
        # that exec the staged ffmpeg fail with exit code -1. Download
        # a portable build directly so `where ffmpeg` resolves to the
        # actual ffmpeg.exe.
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          $binDir = (Get-ChildItem ffmpeg-extracted -Directory)[0].FullName + "\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
          & "$binDir\ffmpeg.exe" -version

      - name: Ensure ffmpeg present (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version

      - name: Stage system ffmpeg into assets/bin
        run: dart run tool/stage_system_ffmpeg.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test (with coverage)
        run: flutter test --coverage

      - name: Coverage summary
        run: dart run tool/coverage_summary.dart

      # Release builds on SemVer tag pushes; debug builds otherwise.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        # Disable code signing — we don't have a Developer ID on CI; the
        # produced .app is unsigned and Gatekeeper will warn end users
        # the first time they open it. Right-click → Open dismisses the
        # warning. Add a Developer ID + signing setup later for a
        # one-click experience.
        run: |
          if [[ "${{ steps.release.outputs.is_release }}" == "true" ]]; then
            flutter build macos --release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            flutter build macos --debug
          fi

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ninja-build libgtk-3-dev
          if [[ "${{ steps.release.outputs.is_release }}" == "true" ]]; then
            flutter build linux --release
          else
            flutter build linux --debug
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ('${{ steps.release.outputs.is_release }}' -eq 'true') {
            flutter build windows --release
          } else {
            flutter build windows --debug
          }

      # ---- Tag-triggered release artifacts ----
      #
      # When a SemVer tag is pushed, zip the per-platform release output
      # and attach it to (or upsert) a GitHub Release with that tag.
      # softprops/action-gh-release@v2 handles the create-or-update
      # idempotently across the three matrix runners — all three end up
      # attached to the same Release.

      - name: Package macOS app (release only)
        if: steps.release.outputs.is_release == 'true' && runner.os == 'macOS'
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent m4b_chapterizer.app \
            "$GITHUB_WORKSPACE/m4b-chapterizer-${GITHUB_REF_NAME}-macos.zip"

      - name: Package Linux app (release only)
        if: steps.release.outputs.is_release == 'true' && runner.os == 'Linux'
        run: |
          cd build/linux/x64/release
          zip -r "$GITHUB_WORKSPACE/m4b-chapterizer-${GITHUB_REF_NAME}-linux.zip" bundle

      - name: Package Windows app (release only)
        if: steps.release.outputs.is_release == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "$env:GITHUB_WORKSPACE\m4b-chapterizer-$env:GITHUB_REF_NAME-windows.zip"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $dest

      - name: Attach to GitHub Release (release only)
        if: steps.release.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: m4b-chapterizer-${{ github.ref_name }}-*.zip
          fail_on_unmatched_files: true
